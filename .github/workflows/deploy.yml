name: Java 17 Backend CI/CD with GHCR

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      - name: Build and Push Docker Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/cubickim/abcd_be:latest,ghcr.io/cubickim/abcd_be:${{ github.run_number }}

      - name: Checkout Manifest Repository
        uses: actions/checkout@v4
        with:
          repository: 'CubicKim/abcd_ppp-manifest'
          token: ${{ secrets.GH_TOKEN }}
          path: manifest-repo

      # 🎯 [핵심] abcd_be 폴더로 들어가서 도면을 수정하도록 조절
      - name: Update Kubernetes Manifest
        run: |
          cd manifest-repo/abcd_be
          sed -i 's|image: ghcr.io/.*|image: ghcr.io/cubickim/abcd_be:'${{ github.run_number }}'|g' deployment.yaml

      - name: Commit and Push Manifest Changes
        run: |
          cd manifest-repo/abcd_be
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add deployment.yaml
          git commit -m "Auto-update abcd_be image to version ${{ github.run_number }} [skip ci]"
          git push origin main